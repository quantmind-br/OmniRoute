name: Nightly image (upstream default branch)

# Builds TARGET runner-base from the DEFAULT BRANCH HEAD of the upstream
# repository (diegosouzapw/OmniRoute) and publishes a MULTI-ARCH manifest
# list (amd64 + arm64) to GHCR.
#
# Schedule: 05:50 UTC = 02:50 BRT — ready before the 04:00 BRT deploys.
#
# Native runners per platform (no QEMU: Rust compile under emulation is
# unusable). The bun/web variants that OOM upstream CI are NOT built here.
# Builds with WEBPACK (OMNIROUTE_USE_TURBOPACK=0 build-arg): Turbopack's native
# Rust peak is NOT bounded by --max-old-space-size (#6409) and OOMs the hosted
# runners ("cannot allocate memory") on some trees — upstream CI hits the same
# wall. Webpack's peak (~3.9 GB) is bounded by OMNIROUTE_BUILD_MEMORY_MB, so we
# raise it via build-arg for headroom. The 12 GB swapfile stays as a safety net.

on:
  schedule:
    - cron: "50 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nightly-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/quantmind-br/omniroute

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout upstream default branch HEAD
        uses: actions/checkout@v7
        with:
          repository: diegosouzapw/OmniRoute
          persist-credentials: false

      - name: Record source revision
        id: rev
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Add 12 GB swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/build-swap
          sudo chmod 600 /mnt/build-swap
          sudo mkswap /mnt/build-swap
          sudo swapon /mnt/build-swap
          free -h

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: ${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: ${{ env.IMAGE }}
          # Force webpack: the upstream Dockerfile defaults to Turbopack, whose
          # native Rust memory is unbounded and OOMs these hosted runners
          # ("cannot allocate memory"). Webpack's peak is bounded by
          # OMNIROUTE_BUILD_MEMORY_MB, so raise it for headroom. Drop these
          # build-args to go back to the upstream default bundler.
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=6144
          cache-from: type=gha,scope=nightly-${{ matrix.arch }}
          cache-to: type=gha,scope=nightly-${{ matrix.arch }},mode=max
          labels: |
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.source=https://github.com/diegosouzapw/OmniRoute

      - name: Export digest and revision
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
          echo "${{ steps.rev.outputs.sha }}" > /tmp/rev.txt
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload revision
        uses: actions/upload-artifact@v7
        with:
          name: rev-${{ matrix.arch }}
          path: /tmp/rev.txt
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/artifacts

      - name: Stage digests and revision
        run: |
          mkdir -p /tmp/digests
          cp /tmp/artifacts/digests-amd64/* /tmp/artifacts/digests-arm64/* /tmp/digests/
          REV=$(cat /tmp/artifacts/rev-amd64/rev.txt)
          echo "REV=$REV" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create multi-arch manifest list and push
        working-directory: /tmp/digests
        run: |
          ARGS=""
          [ -n "$REV" ] && ARGS="-t $IMAGE:r$REV"
          docker buildx imagetools create $ARGS \
            -t $IMAGE:nightly \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect "$IMAGE:nightly"
